function roundWorkingLength(mm){
  if(!Number.isFinite(mm)||mm<=0) throw new Error('Ungültige Dachflächenlänge');
  return Math.floor((mm+5)/10)*10;
}
function ruleForPitch(rules,pitch){
  return rules.find(r=>{
    if(r.min!=null&&pitch<r.min)return false;
    if(r.minExclusive!=null&&pitch<=r.minExclusive)return false;
    if(r.max!=null&&pitch>r.max)return false;
    if(r.maxInclusive!=null&&pitch>r.maxInclusive)return false;
    if(r.maxExclusive!=null&&pitch>=r.maxExclusive)return false;
    return true;
  })||null;
}
function inRange(value,range){
  if(!range)return true;
  if(range.min!=null&&value<range.min)return false;
  if(range.minExclusive!=null&&value<=range.minExclusive)return false;
  if(range.max!=null&&value>range.max)return false;
  if(range.maxExclusive!=null&&value>=range.maxExclusive)return false;

const fmtLZ=n=>Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString('de-DE'):'–';

  }

    const recent=getRecent().map(productById).filter(Boolean);
    app.innerHTML=shell('Dacheindeckung',`${recent.length?`<div class="recent"><h2>Zuletzt verwendet</h2>${recent.map(p=>`<button class="chip recentP" data-id="${p.productId}">${p.name}</button>`).join('')}</div>`:''}<label>Hersteller / Pfanne<select id="product">${productOptions()}</select></label><div id="productHint"></div><button class="secondary" id="manual">PFANNE MANUELL</button><button class="primary" id="next">WEITER</button>`);
    bindBack('roof');
    const hint=()=>{const p=productById($('#product').value);$('#productHint').innerHTML=`<div class="card"><b>${p.manufacturer} · ${p.name}</b><p>${dataBadge(p)}</p>${p.regularRoofPitch?`<p>Regeldachneigung: ${p.regularRoofPitch}°${p.minimumRoofPitch?` · Mindestdachneigung: ${p.minimumRoofPitch}°`:''}</p>`:''}<small>Fehlende Werte werden nicht geschätzt.</small></div>`;};
    hint();$('#product').onchange=hint;document.querySelectorAll('.recentP').forEach(b=>b.onclick=()=>{$('#product').value=b.dataset.id;hint();});$('#manual').onclick=()=>nav('manual');$('#next').onclick=()=>{state.productId=$('#product').value;state.ridgeSystem='';state.battenSize='';state.specialTopInterval='NONE';state.targetLAT='';state.targetPUT='';addRecent(state.productId);nav('eaves');};return;
  }
  if(state.screen==='manual'){
    app.innerHTML=shell('Pfanne manuell',`<p class="notice">Manuelle Produktdaten gelten nur für diese Berechnung und führen immer zu ⚠ PRÜFEN.</p><label>Bezeichnung<input id="mn" placeholder="Pfannenmodell"></label><div class="grid2"><label>LA min mm<input id="lmin" inputmode="numeric"></label><label>LA max mm<input id="lmax" inputmode="numeric"></label></div><label>LAF mm<input id="mlaf" inputmode="numeric"></label><h2>PÜT/LAT linear</h2><div class="grid2"><label>PÜT min<input id="pmin" value="0"></label><label>LAT bei PÜT min<input id="latmax"></label><label>PÜT max<input id="pmax" value="80"></label><label>LAT bei PÜT max<input id="latmin"></label></div><button class="primary" id="use">MANUELLE PFANNE VERWENDEN</button>`);
    bindBack('product');$('#use').onclick=()=>{const mn=$('#mn').value,lmin=+$(`#lmin`).value,lmax=+$(`#lmax`).value,laf=+$(`#mlaf`).value,pmin=+$(`#pmin`).value,pmax=+$(`#pmax`).value,latAtMin=+$(`#latmax`).value,latAtMax=+$(`#latmin`).value;if(!mn||!lmin||!lmax||!laf||!latAtMin||!latAtMax)return alert('Bitte alle Pflichtwerte ausfüllen.');const id='manual_current';const old=PRODUCTS.findIndex(p=>p.productId===id);if(old>=0)PRODUCTS.splice(old,1);PRODUCTS.push({manufacturerId:'manual',manufacturer:'Manuell',productId:id,name:mn,productType:'ROOF_TILE',environment:'MANUAL',dataCompleteness:'MANUAL',longitudinal:{pitchRules:[{min:null,max:null,laMin:lmin,laMax:lmax}],laf:{type:'FIXED',value:laf},eaves:{putMin:pmin,putMax:pmax,appDefaultPUT:(pmin+pmax)/2,relation:{type:'LINEAR',points:[{put:pmin,lat:latAtMin},{put:pmax,lat:latAtMax}]}}},vergeSystems:[],sources:[{type:'MANUAL_USER_INPUT',lastVerified:new Date().toISOString().slice(0,10)}]});state.productId=id;state.manualProduct=true;nav('eaves');};return;
  }
  if(state.screen==='eaves'){
    const p=productById(state.productId),e=p.longitudinal?.eaves||{},hasRelation=!!e.relation;
    const eavesUI=hasRelation?`<div class="card"><b>${p.name}</b><p>Zulässiger PÜT: ${e.putMin}–${e.putMax} mm</p></div><label>Pfannenüberstand Traufe (PÜT) <span>mm</span><input id="put" inputmode="numeric" value="${state.targetPUT||e.preferredPUT||e.appDefaultPUT||''}"></label><p class="muted">${e.preferredPUT!=null?'Hersteller-Vorzugswert':'App-Vorschlag aus dem hinterlegten Bereich; keine Herstellerempfehlung.'}</p>`:`<div class="warning">⚠ Für ${p.name} ist keine eindeutige PÜT/LAT-Beziehung hinterlegt. LattFix rät nicht.</div>${e.referenceLAT?`<div class="card"><b>Hersteller-Orientierungswert</b><p>Mittleres Traufenlattmaß: ca. ${e.referenceLAT} mm</p><small>Nur Orientierung – bitte für die konkrete Ausführung prüfen.</small></div>`:''}<label>Traufenlattmaß LAT <span>manuell, mm</span><input id="tlat" inputmode="numeric" value="${esc(state.targetLAT)}" placeholder="z. B. ${e.referenceLAT||360}"></label>`;
    app.innerHTML=shell('Traufe',`${eavesUI}<label>Eigenes Lattmaß <span>optional, mm</span><input id="mla" inputmode="numeric" value="${esc(state.manualLA)}"></label><button class="primary" id="next">WEITER</button>`);
    bindBack('product');$('#next').onclick=()=>{state.targetPUT=$('#put')?.value||'';state.targetLAT=$('#tlat')?.value||'';state.manualLA=$('#mla').value;if(!hasRelation&&!Number(state.targetLAT))return alert('Bitte das Traufenlattmaß LAT eingeben.');nav('ridge');};return;
  }
  if(state.screen==='ridge'){
    const p=productById(state.productId),vs=p.vergeSystems||[],ridgeSystems=p.ridgeSystems||[],specials=p.longitudinal?.specialTopIntervals||[];
    if(!state.battenSize)state.battenSize=p.defaultBattenSize||p.battenSizes?.[0]||'';
    if(!state.ridgeSystem)state.ridgeSystem=ridgeSystems[0]?.id||'';
    const battenUI=p.battenSizes?.length?`<label>Traglattenquerschnitt<select id="batten">${p.battenSizes.map(x=>`<option value="${x}" ${x===state.battenSize?'selected':''}>${x.replace('x',' × ')} mm</option>`).join('')}</select></label>`:'';
    const ridgeUI=ridgeSystems.length?`<label>Firstsystem<select id="ridgeSystem">${ridgeSystems.map(r=>`<option value="${r.id}" ${r.id===state.ridgeSystem?'selected':''}>${r.name}</option>`).join('')}</select></label><div class="card" id="lafPreview"></div>`:`<div class="card"><b>First</b><p>${p.longitudinal?.laf?.type==='FIXED'?`LAF laut Datensatz: ${p.longitudinal.laf.value} mm`:'Kein automatisches Firstsystem hinterlegt.'}</p></div>`;
    const specialUI=specials.length?`<label>Oberste Ziegelreihe / Sonderabstand<select id="specialTop"><option value="NONE">Keine Sonderlattweite – normale Flächenlattung</option>${specials.map(x=>`<option value="${x.id}" ${x.id===state.specialTopInterval?'selected':''}>${x.name} · ${x.min===x.max?`${x.min} mm`:`${x.min}–${x.max} mm`}</option>`).join('')}</select></label><div class="card"><small>Nur ausdrücklich vom Hersteller hinterlegte Sonderlattweiten werden verwendet. Alle übrigen Flächenabstände bleiben gleich.</small></div>`:'';
    app.innerHTML=shell('First & Ortgang',`${battenUI}${ridgeUI}${specialUI}<label>LAF manuell überschreiben <span>optional</span><input id="laf" inputmode="numeric" value="${esc(state.manualLaf)}" placeholder="nur wenn Herstellerwert geprüft"></label><label>Ortgang<select id="verge"><option value="AUTO">Noch nicht vorhanden – passende Variante ermitteln</option><option value="NONE">Keine Ortgangsteine</option>${vs.map(v=>`<option value="${v.id}">${v.name}</option>`).join('')}</select></label><button class="primary" id="calc">BERECHNEN</button>`);
    bindBack('eaves');$('#verge').value=state.vergeSystem;
    const preview=()=>{if(!ridgeSystems.length)return;const ridge=$('#ridgeSystem').value,bat=$('#batten')?.value||state.battenSize;const r=resolveLaf(p,Number(state.roofPitch),null,ridge,bat);$('#lafPreview').innerHTML=r?`<b>LAF laut Herstellerdatensatz</b><p>${r.value} mm bei ${fmt(Number(state.roofPitch))}°${bat?` · Latte ${bat.replace('x',' × ')} mm`:''}</p>`:`<b>Kein Tabellenwert für exakt ${fmt(Number(state.roofPitch))}°</b><p>Zwischenwerte werden nicht erfunden. LAF bitte aus Herstellerunterlage prüfen und oben manuell eintragen.</p>`;};
    $('#ridgeSystem')?.addEventListener('change',preview);$('#batten')?.addEventListener('change',preview);preview();
    $('#calc').onclick=()=>{state.manualLaf=$('#laf').value;state.vergeSystem=$('#verge').value;state.ridgeSystem=$('#ridgeSystem')?.value||'';state.battenSize=$('#batten')?.value||'';state.specialTopInterval=$('#specialTop')?.value||'NONE';state.result=calculateLongitudinal({...state},p);nav('result');};return;
  }
  if(state.screen==='result'){
    const r=state.result,p=r.product;
    const main=r.selectedLA?`<div class="resultHero"><div class="status ${r.status.toLowerCase()}">${statusText(r.status)}</div><div class="eyebrow">LATTMAẞ</div><div class="big">${fmt(r.selectedLA)} <small>mm</small></div><div>${r.specialTopInterval?`${r.numberOfNormalIntervals} gleiche Flächenabstände + 1 First-Sonderabstand · ${r.numberOfBattenPositions} Lattenpositionen`:`${r.numberOfIntervals} gleiche Lattenabstände · ${r.numberOfBattenPositions} Lattenpositionen`}</div></div>`:`<div class="resultHero"><div class="status ${r.status.toLowerCase()}">${statusText(r.status)}</div><p>${r.warnings?.[0]||'Berechnung nicht möglich.'}</p></div>`;
    const eavesDetails=r.targetPUT!=null?`<p>PÜT Ziel <b>${fmt(r.targetPUT)} mm</b></p><p>PÜT tatsächlich <b>${fmt(r.actualPUT)} mm</b></p>`:`<p>LAT Ziel <b>${fmt(r.targetLAT)} mm</b></p><p>PÜT <b>nicht automatisch bestimmbar</b></p>`;
    app.innerHTML=shell('Ergebnis',`${state.label?`<div class="labelTitle">${esc(state.label)}</div>`:''}${main}${r.selectedLA?`<div class="gridCards"><div class="card"><h2>Traufe</h2>${eavesDetails}<p>LAT tatsächlich <b>${fmt(r.actualLAT)} mm</b></p></div><div class="card"><h2>First</h2><p>LAF <b>${fmt(r.laf)} mm</b></p>${r.specialTopInterval?`<p><b>${r.specialTopInterval.name}</b><br>Sonderabstand ${fmt(r.specialTopInterval.value)} mm</p>`:''}${r.ridgeSystem?`<p>${r.ridgeSystem.name}</p>`:''}${r.battenSize?`<p>Latte ${r.battenSize.replace('x',' × ')} mm</p>`:''}<p>${r.vergeSystem?.name||'Kein fester Ortgang gewählt'}</p></div><div class="card"><h2>Dach</h2><p>Gemessen ${fmt(r.measuredRoofLength)} mm</p><p>Arbeitsmaß ${fmt(r.workingRoofLength)} mm</p><p>${fmt(r.roofPitch)}°</p></div></div><div class="latten"><b>Einteilung First → Traufe</b>${r.battenPositionsFromRidge.map((pos,i)=>`<div><span>${String(r.numberOfBattenPositions-i).padStart(2,'0')}</span><i></i><em>${fmt(pos)} mm</em></div>`).join('')}</div>`:''}${r.warnings?.length?`<div class="warning">${r.warnings.map(w=>`<div>⚠ ${w}</div>`).join('')}</div>`:''}<div class="actions">${r.alternatives?.length?'<button class="secondary" id="alts">ALTERNATIVEN ANZEIGEN</button>':''}<button class="secondary" id="cross">+ QUEREINTEILUNG HINZUFÜGEN</button><button class="secondary" id="share">LATTZETTEL TEILEN</button><button class="primary" id="new">NEU BERECHNEN</button></div><details class="source"><summary>Herstellerdaten</summary><p>Datenstatus: ${p.dataCompleteness}</p>${(p.sources||[]).map(s=>`<p><b>${s.manufacturer||''}</b><br>${s.documentTitle||s.type}<br>geprüft: ${s.lastVerified||'–'}</p>`).join('')}</details>`);
    bindBack('ridge');$('#new').onclick=()=>{state={screen:'roof',measuredRoofLength:'',roofPitch:'',label:'',productId:state.productId,targetPUT:'',targetLAT:'',manualLA:'',manualLaf:'',vergeSystem:'AUTO',ridgeSystem:'',battenSize:'',specialTopInterval:'NONE',result:null,cross:null};render();};$('#cross').onclick=()=>nav('cross');$('#share').onclick=()=>shareLattzettel(r,state.cross,state.label);$('#alts')?.addEventListener('click',()=>nav('alternatives'));return;
  }
  if(state.screen==='alternatives'){
    const r=state.result;app.innerHTML=shell('Alternativen',`<p>Weitere reguläre Einteilungen. Die aktuelle Empfehlung bleibt aktiv, bis du eine andere auswählst.</p>${r.alternatives.map((a,i)=>`<button class="alt" data-i="${i}"><b>${a.specialTopInterval?`${a.normalIntervals} × ${a.la} mm + ${a.specialTopInterval.value} mm Sonderabstand`:`${a.n} × ${a.la} mm`}</b><span>${a.actualPUT!=null?`PÜT ${fmt(a.actualPUT)} mm · `:''}LAT ${fmt(a.actualLAT)} mm</span></button>`).join('')}`);bindBack('result');document.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{const a=r.alternatives[+b.dataset.i],old={la:r.selectedLA,n:r.numberOfIntervals,normalIntervals:r.numberOfNormalIntervals,specialTopInterval:r.specialTopInterval,positions:r.battenPositionsFromRidge,actualLAT:r.actualLAT,actualPUT:r.actualPUT,putDeviation:r.putDeviation,latDeviation:r.latDeviation,verge:r.vergeSystem};r.alternatives[+b.dataset.i]={la:old.la,n:old.n,normalIntervals:old.normalIntervals,specialTopInterval:old.specialTopInterval,positions:old.positions,actualLAT:old.actualLAT,actualPUT:old.actualPUT,putDeviation:old.putDeviation,latDeviation:old.latDeviation,verge:old.verge};r.selectedLA=a.la;r.numberOfIntervals=a.n;r.numberOfNormalIntervals=a.normalIntervals;r.specialTopInterval=a.specialTopInterval;r.numberOfBattenPositions=a.positions.length;r.battenPositionsFromRidge=a.positions;r.actualLAT=a.actualLAT;r.actualPUT=a.actualPUT;r.putDeviation=a.putDeviation;r.latDeviation=a.latDeviation;r.vergeSystem=a.verge;nav('result');});return;
  }
  if(state.screen==='cross'){
    const p=productById(state.productId),c=p.crossLayout,site=c?.siteMeasurementRequired;
    app.innerHTML=shell('Quereinteilung',`<div class="card"><b>${p.name}</b><p>${c?c.mode:'Keine Querdaten'}</p>${site?`<p>Herstellerwert ca. ${c.preferredCoverWidth??c.referenceCoverWidth??'–'} mm – tatsächliches Deckmaß prüfen.</p>`:''}</div><label>Einteilbreite <span>mm</span><input id="cw" inputmode="numeric" placeholder="z. B. 8950"></label>${site?`<label>Tatsächliche Deckbreite <span>Baustellenmaß, mm</span><input id="siteCover" inputmode="decimal" placeholder="z. B. ${c.preferredCoverWidth??c.referenceCoverWidth??''}"></label>`:''}<label>Schnüren alle <span>Pfannen</span><input id="every" inputmode="numeric" value="5"></label><label class="check"><input id="verg" type="checkbox" checked> Ortgangmaße berücksichtigen</label><button class="primary" id="cc">QUEREINTEILUNG BERECHNEN</button><div id="cr"></div>`);
    bindBack('result');$('#cc').onclick=()=>{state.cross=calculateCross({usableRoofWidth:$('#cw').value,stringEveryTiles:$('#every').value,useVerges:$('#verg').checked,actualSiteCoverWidth:$('#siteCover')?.value||''},p);const x=state.cross;$('#cr').innerHTML=`<div class="card resultCross"><h2>${statusText(x.status)}</h2>${x.actualCoverWidth?`<div class="bigSmall">${fmt(x.actualCoverWidth)} mm</div><p>${x.tileCount} Pfannen · Schnürabstand ${fmt(x.stringSpacing)} mm</p>`:''}${(x.warnings||[]).map(w=>`<p>⚠ ${w}</p>`).join('')}${x.stringPositions?.length?`<h3>Schnürpositionen</h3><p>${x.stringPositions.map((v,i)=>`${i+1}: ${fmt(v)} mm`).join(' · ')}</p>`:''}<button class="secondary" id="backres">ZUM ERGEBNIS</button></div>`;$('#backres').onclick=()=>nav('result');};return;
  }
  if(state.screen==='info'){
    const grouped=Object.groupBy?Object.groupBy(PRODUCTS.filter(p=>p.environment==='PRODUCTION'),p=>p.manufacturer):PRODUCTS.filter(p=>p.environment==='PRODUCTION').reduce((a,p)=>((a[p.manufacturer]??=[]).push(p),a),{});
    app.innerHTML=shell('Herstellerdaten',`<p>Datenbank ${DATABASE_META.databaseVersion}</p><p>LattFix verwendet nur hinterlegte, quellenbezogene Werte. Fehlende Herstellerwerte werden nicht geschätzt.</p>${Object.entries(grouped).map(([m,ps])=>`<h2 class="manufacturerTitle">${m}</h2>${ps.map(p=>`<div class="card"><b>${p.name}</b><p>${dataBadge(p)}</p><small>${p.sources?.[0]?.documentTitle||''}<br>geprüft ${p.sources?.[0]?.lastVerified||'–'}</small></div>`).join('')}`).join('')}`);bindBack('start');return;
  }
}
try{render();}catch(e){document.getElementById('app').innerHTML='<main style="padding:28px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif"><h1>LattFix</h1><p>Startfehler:</p><p style="color:#f1d184">'+String(e&&e.message?e.message:e)+'</p></main>';console.error(e);}

</script></body></html>
