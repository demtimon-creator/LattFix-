  }
  if(state.screen==='alternatives'){
    const r=state.result;app.innerHTML=shell('Alternativen',`<p>Weitere reguläre Einteilungen. Die aktuelle Empfehlung bleibt aktiv, bis du eine andere auswählst.</p>${r.alternatives.map((a,i)=>`<button class="alt" data-i="${i}"><b>${a.specialTopInterval?`${a.normalIntervals} × ${a.la} mm + ${a.specialTopInterval.value} mm Sonderabstand`:`${a.n} × ${a.la} mm`}</b><span>${a.actualPUT!=null?`PÜT ${fmt(a.actualPUT)} mm · `:''}LAT ${fmt(a.actualLAT)} mm</span></button>`).join('')}`);bindBack('result');document.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{const a=r.alternatives[+b.dataset.i],old={la:r.selectedLA,n:r.numberOfIntervals,normalIntervals:r.numberOfNormalIntervals,specialTopInterval:r.specialTopInterval,positions:r.battenPositionsFromRidge,actualLAT:r.actualLAT,actualPUT:r.actualPUT,putDeviation:r.putDeviation,latDeviation:r.latDeviation,verge:r.vergeSystem};r.alternatives[+b.dataset.i]={la:old.la,n:old.n,normalIntervals:old.normalIntervals,specialTopInterval:old.specialTopInterval,positions:old.positions,actualLAT:old.actualLAT,actualPUT:old.actualPUT,putDeviation:old.putDeviation,latDeviation:old.latDeviation,verge:old.verge};r.selectedLA=a.la;r.numberOfIntervals=a.n;r.numberOfNormalIntervals=a.normalIntervals;r.specialTopInterval=a.specialTopInterval;r.numberOfBattenPositions=a.positions.length;r.battenPositionsFromRidge=a.positions;r.actualLAT=a.actualLAT;r.actualPUT=a.actualPUT;r.putDeviation=a.putDeviation;r.latDeviation=a.latDeviation;r.vergeSystem=a.verge;nav('result');});return;
  }
  if(state.screen==='cross'){
    const p=productById(state.productId),c=p.crossLayout,site=c?.siteMeasurementRequired;
    app.innerHTML=shell('Quereinteilung',`<div class="card"><b>${p.name}</b><p>${c?c.mode:'Keine Querdaten'}</p>${site?`<p>Herstellerwert ca. ${c.preferredCoverWidth??c.referenceCoverWidth??'–'} mm – tatsächliches Deckmaß prüfen.</p>`:''}</div><label>Einteilbreite <span>mm</span><input id="cw" inputmode="numeric" placeholder="z. B. 8950"></label>${site?`<label>Tatsächliche Deckbreite <span>Baustellenmaß, mm</span><input id="siteCover" inputmode="decimal" placeholder="z. B. ${c.preferredCoverWidth??c.referenceCoverWidth??''}"></label>`:''}<label>Schnüren alle <span>Pfannen</span><input id="every" inputmode="numeric" value="5"></label><label class="check"><input id="verg" type="checkbox" checked> Ortgangmaße berücksichtigen</label><button class="primary" id="cc">QUEREINTEILUNG BERECHNEN</button><div id="cr"></div>`);
    bindBack('result');$('#cc').onclick=()=>{state.cross=calculateCross({usableRoofWidth:$('#cw').value,stringEveryTiles:$('#every').value,useVerges:$('#verg').checked,actualSiteCoverWidth:$('#siteCover')?.value||''},p);const x=state.cross;$('#cr').innerHTML=`<div class="card resultCross"><h2>${statusText(x.status)}</h2>${x.actualCoverWidth?`<div class="bigSmall">${fmt(x.actualCoverWidth)} mm</div><p>${x.wholeTiles!=null?`${x.wholeTiles} ganze${x.halfTiles?` + ${x.halfTiles} halbe`:''}`:`${x.tileCount}`} Pfannen · Schnürabstand ${fmt(x.stringSpacing)} mm</p>${x.residual!=null&&Math.abs(x.residual)>0.01?`<p>Maßabweichung <b>${fmt(x.residual)} mm</b></p>`:''}`:''}${(x.warnings||[]).map(w=>`<p>⚠ ${w}</p>`).join('')}${x.stringPositions?.length?`<h3>Schnürpositionen</h3><p>${x.stringPositions.map((v,i)=>`${i+1}: ${fmt(v)} mm`).join(' · ')}</p>`:''}<button class="secondary" id="backres">ZUM ERGEBNIS</button></div>`;$('#backres').onclick=()=>nav('result');};return;
  }
  if(state.screen==='lattzettel'){
    app.innerHTML=shell('Lattzettel',`<div class="card"><p>Baustellenansicht. Zum Weitergeben oder Speichern unten auf <b>TEILEN</b> tippen.</p></div><img src="${state.lattzettelImage||''}" alt="Lattzettel" style="display:block;width:100%;height:auto;background:#fff;border-radius:10px;border:1px solid #444"><button class="primary" id="shareLZ">LATTZETTEL TEILEN</button><button class="secondary" id="backResult">ZUM ERGEBNIS</button>`);
    bindBack('result');$('#shareLZ').onclick=()=>shareLattzettel(state.result,state.cross,state.label);$('#backResult').onclick=()=>nav('result');return;
  }
  if(state.screen==='info'){
    const grouped=Object.groupBy?Object.groupBy(PRODUCTS.filter(p=>p.environment==='PRODUCTION'),p=>p.manufacturer):PRODUCTS.filter(p=>p.environment==='PRODUCTION').reduce((a,p)=>((a[p.manufacturer]??=[]).push(p),a),{});
    app.innerHTML=shell('Herstellerdaten',`<p><b>Version 4.5</b> · Datenbank ${DATABASE_META.databaseVersion}</p><p>LattFix verwendet nur hinterlegte, quellenbezogene Werte. Fehlende Herstellerwerte werden nicht geschätzt.</p>${Object.entries(grouped).map(([m,ps])=>`<h2 class="manufacturerTitle">${m}</h2>${ps.map(p=>`<div class="card"><b>${p.name}</b><p>${dataBadge(p)}</p><small>${p.sources?.[0]?.documentTitle||''}<br>geprüft ${p.sources?.[0]?.lastVerified||'–'}</small></div>`).join('')}`).join('')}`);bindBack('start');return;
  }
}
try{render();}catch(e){document.getElementById('app').innerHTML='<main style="padding:28px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif"><h1>LattFix</h1><p>Startfehler:</p><p style="color:#f1d184">'+String(e&&e.message?e.message:e)+'</p></main>';console.error(e);}

</script></body></html>
